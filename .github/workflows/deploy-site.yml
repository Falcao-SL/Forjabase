# Copiar para .github/workflows/deploy-site.yml de cada produto Falcao-SL.
# Secrets da org (ou do repo):
#   HOMELAB_DEPLOY_SSH_KEY  — privada (par de secrets/sites-deploy no Homelab)
#   HOMELAB_DEPLOY_HOST     — opcional; no runner da VM: 127.0.0.1
#
# Ajuste SLUG abaixo (pasta em /data/sites/<slug>/public/).
# O edge é um Caddy só; o deploy é só rsync (sem compose por site).
#
# Fonte (nessa ordem):
#   1. site/index.html
#   2. index.html na raiz do repo (hub FalcaoSL)
#   3. deploy/site/index.html (legado)
# Nunca use deploy/site só com Dockerfile/nginx — isso não é o site.

name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "deploy/site/**"
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, homelab]
    env:
      SLUG: forja
      HOST: ${{ secrets.HOMELAB_DEPLOY_HOST || '127.0.0.1' }}
      DEPLOY_USER: deploy
      REMOTE: /data/sites
    steps:
      - uses: actions/checkout@v5

      - name: rsync site → /data/sites/<slug>/public
        env:
          SSH_KEY: ${{ secrets.HOMELAB_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_KEY:-}" || { echo "Falta secret HOMELAB_DEPLOY_SSH_KEY na org"; exit 1; }

          if [[ -f site/index.html ]]; then
            SRC=site
            RSYNC_EXCLUDES=()
          elif [[ -f index.html ]]; then
            SRC=.
            RSYNC_EXCLUDES=(
              --exclude '.git/'
              --exclude '.github/'
              --exclude 'deploy/'
              --exclude 'docs/'
              --exclude 'scripts/'
              --exclude '.gitignore'
              --exclude '*.md'
            )
          elif [[ -f deploy/site/index.html ]]; then
            SRC=deploy/site
            RSYNC_EXCLUDES=()
          else
            echo "Sem site/index.html, index.html na raiz, nem deploy/site/index.html"
            exit 1
          fi
          echo "SRC=$SRC"

          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          ssh_opts=(-i key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          rsync -az --delete "${RSYNC_EXCLUDES[@]}" -e "ssh ${ssh_opts[*]}" \
            "$SRC"/ "${DEPLOY_USER}@${HOST}:${REMOTE}/${SLUG}/public/"
