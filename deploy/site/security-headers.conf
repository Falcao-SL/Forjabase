# Cabeçalhos de segurança em arquivo à parte por uma regra do nginx: um
# `add_header` dentro de um `location` DESCARTA todos os herdados do `server`.
# Sem repetir o include em cada location que define Cache-Control, as rotas mais
# servidas sairiam sem CSP nenhum.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
