# Site do Forja — configuração do nginx dentro do contêiner.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/forja-security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/xml
               image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Health check para Coolify / Docker
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location /assets/ {
        include /etc/nginx/snippets/forja-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /styles.css {
        include /etc/nginx/snippets/forja-security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /motion.js {
        include /etc/nginx/snippets/forja-security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    location = / {
        include /etc/nginx/snippets/forja-security-headers.conf;
        add_header Cache-Control "public, max-age=300";
        try_files /index.html =404;
    }

    location = /index.pt.html {
        include /etc/nginx/snippets/forja-security-headers.conf;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
