[package]
name = "forja-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
bytes = { version = "1.12.1", optional = true }
deadpool-postgres = { version = "0.14.2", optional = true }
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { optional = true, version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.0", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "fs"] }
tokio-postgres = { version = "0.7.18", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true }
turso = { version = "0.8.3", optional = true }
webpki-roots = { version = "1", optional = true }
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# SQLite é o motor suportado (ARQUITETURA.md, decisão 1). Os outros dois
# continuam compilando para não perder o trabalho, mas sem suporte:
# `--features postgres` ou `--features turso` quando alguém for mexer neles.
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
turso = ["dep:turso"]
postgres = [
    "dep:tokio-postgres",
    "dep:deadpool-postgres",
    "dep:bytes",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:webpki-roots",
]
